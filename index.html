    /* ===== SCROLL REVEAL COMPONENT ===== */
    const ScrollReveal = ({ children, direction = 'up', delay = 0, className = '' }) => {
      const [isVisible, setIsVisible] = useState(false);
      const ref = useRef(null);

      useEffect(() => {
        const observer = new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting) {
            setIsVisible(true);
            observer.unobserve(entry.target);
          }
        }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
        if (ref.current) observer.observe(ref.current);
        return () => observer.disconnect();
      }, []);

      const hiddenMap = {
        up: 'opacity-0 translate-y-16',
        down: 'opacity-0 -translate-y-16',
        left: 'opacity-0 -translate-x-16',
        right: 'opacity-0 translate-x-16',
        scale: 'opacity-0 scale-90',
      };

      return (
        <div ref={ref}
          className={`transition-all duration-1000 ease-out ${className} ${isVisible ? 'opacity-100 translate-y-0 translate-x-0 scale-100' : hiddenMap[direction]}`}
          style={{ transitionDelay: `${delay}ms` }}>
          {children}
        </div>
      );
    };

    /* ===== MAIN APP ===== */

      const [searchQuery, setSearchQuery] = useState('');

      const [scrollY, setScrollY] = useState(0);

      useEffect(() => {
        let ticking = false;
        const handleScroll = () => {
          if (!ticking) {
            window.requestAnimationFrame(() => { setScrollY(window.scrollY); ticking = false; });
            ticking = true;
          }
        };
        window.addEventListener('scroll', handleScroll, { passive: true });
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const isScrolled = scrollY > 50;

      const scrollToSection = (e, id) => {
        e.preventDefault();
        const el = document.getElementById(id);
        if (el) {
          const offset = 100;
          window.scrollTo({ top: el.getBoundingClientRect().top + window.pageYOffset - offset, behavior: 'smooth' });
        }
        setIsMobileMenuOpen(false);
      };

      const handleUseMyLocation = () => {
        setShowLocationToast(true);
        setTimeout(() => setShowLocationToast(false), 3000);
      };

      const fallbackImage = "https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?auto=format&fit=crop&q=80&w=1200";
      const handleImageError = (e) => { if (e.target.src !== fallbackImage) e.target.src = fallbackImage; };

      const menuItems = [
        { name: "Pollo Asado Entero", desc: "El clásico al carbón. Adobado con receta secreta, incluye papa salada y arepa santandereana.", price: "$38.000", img: "https://images.unsplash.com/photo-1598514982205-f36b96d1e8d4?auto=format&fit=crop&q=80&w=1200", category: "Pollo", badge: "Insignia", rating: 5.0 },
        { name: "Combo Broaster 8 Presas", desc: "Crujiente, dorado y jugoso. La técnica perfecta, servido con papa francesa familiar.", price: "$45.000", img: "https://images.unsplash.com/photo-1569058242253-1df34b06a4fa?auto=format&fit=crop&q=80&w=1200", category: "Pollo", badge: "Familiar", rating: 4.9 },
        { name: "Medio Pollo Asado", desc: "La porción ideal para compartir en pareja. Acompañado de papa salada y arepa.", price: "$20.000", img: "https://images.unsplash.com/photo-1606728035253-49e8d23d4ebe?auto=format&fit=crop&q=80&w=1200", category: "Pollo", rating: 4.8 },
        { name: "Alitas BBQ Picantes", desc: "10 piezas bañadas en salsa artesanal picante, con bastones de apio y aderezo ranch.", price: "$22.000", img: "https://images.unsplash.com/photo-1527477396000-e27163b481c2?auto=format&fit=crop&q=80&w=1200", category: "Acompañantes", spicy: true, rating: 4.9 },
        { name: "Maduro con Queso", desc: "Plátano maduro asado al carbón, abierto y gratinado con abundante queso doble crema.", price: "$8.000", img: "https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?auto=format&fit=crop&q=80&w=1200", category: "Acompañantes", rating: 4.8 },
        { name: "Papa Criolla Frita", desc: "Selección de papa amarilla, frita al instante para garantizar su textura crujiente.", price: "$6.000", img: "https://images.unsplash.com/photo-1585109649139-366815a0d713?auto=format&fit=crop&q=80&w=1200", category: "Acompañantes", rating: 4.7 }
      ];

      const categories = ['Pollo', 'Acompañantes', 'Bebidas'];
      const filteredMenu = menuItems.filter(item => item.category === activeCategory);

      const locations = [
        { name: "CIUDADELA", address: "CARRERA 9 # 9-65", phones: ["6415353", "6985611"], distance: "1.2 km", city: "BUCARAMANGA", mapQuery: "Carrera+9+%23+9-65,+Bucaramanga,+Colombia" },
        { name: "CABECERA", address: "CARRERA 36 NO 54 - 41", phones: ["6960358", "6960677"], distance: "3.5 km", city: "BUCARAMANGA", mapQuery: "Carrera+36+%23+54-41,+Bucaramanga,+Colombia" },
        { name: "LA AURORA", address: "CARRERA 30 NO 33 - 01", phones: ["7013156", "6960826"], distance: "4.1 km", city: "BUCARAMANGA", mapQuery: "Carrera+30+%23+33-01,+Bucaramanga,+Colombia" },
        { name: "LAGOS", address: "CALLE 29 # 31-06", phones: ["6192222", "6193333"], distance: "8.7 km", city: "FLORIDABLANCA", mapQuery: "Calle+29+%23+31-06,+Floridablanca,+Colombia" },
        { name: "VENTURA", address: "KM 2 +217 V. LOS CAUCHOS", phones: ["317 5436397"], distance: "12.4 km", city: "PIEDECUESTA", mapQuery: "Piedecuesta,+Santander,+Colombia" }

        loc.city.toLowerCase().includes(searchQuery.toLowerCase())

              <a href="#sedes" onClick={(e) => scrollToSection(e, 'sedes')} className="hidden md:flex bg-zinc-900 hover:bg-red-600 text-white px-6 py-2.5 rounded-full font-bold text-sm transition-colors shadow-lg flex-shrink-0 items-center gap-2">

                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* === EXPERIENCE BENTO === */}
          <section id="experiencia" className="py-24 bg-white relative">

                  <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>
                  <div className="relative z-10">
                    <div className="bg-red-600 w-16 h-16 rounded-2xl flex items-center justify-center mb-6 text-white shadow-lg">
                      <FlameIcon size={32} />
                    </div>
                    <h3 className="text-3xl lg:text-5xl font-black mb-4 tracking-tight leading-none">100% Asado al Carbón.</h3>
                    <p className="text-zinc-300 text-lg max-w-md font-medium leading-relaxed">

                  <div className="bg-orange-500/10 w-14 h-14 rounded-full flex items-center justify-center mb-6 text-orange-600 group-hover:scale-110 transition-transform">
                    <LeafIcon />
                  </div>
                  <h3 className="text-2xl font-black mb-2 text-zinc-900 tracking-tight">Ingredientes Premium</h3>
                  <p className="text-zinc-600 font-medium">Aves seleccionadas diariamente y vegetales frescos para nuestros acompañantes.</p>
                </ScrollReveal>
                <ScrollReveal direction="up" delay={300} className="relative overflow-hidden rounded-[2.5rem] bg-zinc-100 p-8 lg:p-10 group flex flex-col justify-center min-h-[250px]">
                  <div className="bg-zinc-200 w-14 h-14 rounded-full flex items-center justify-center mb-6 text-zinc-900 group-hover:scale-110 transition-transform">
                    <ShieldCheckIcon />
                  </div>
                  <h3 className="text-2xl font-black mb-2 text-zinc-900 tracking-tight">Empaque Seguro</h3>
                  <p className="text-zinc-600 font-medium">Sellado térmico para garantizar la temperatura y frescura hasta la puerta de tu casa.</p>
                </ScrollReveal>
              </div>
            </div>
          </section>

          {/* === MENU === */}
          <section id="menú" className="py-24 bg-[#fcfbf9] relative z-20">
            <div className="max-w-7xl mx-auto px-6 lg:px-8">
              <div className="flex flex-col md:flex-row justify-between items-end gap-8 mb-16">
                <ScrollReveal direction="up">
                  <h2 className="text-5xl md:text-7xl font-black tracking-tighter text-zinc-900 leading-none">Nuestro <br className="hidden md:block" />Menú.</h2>
                </ScrollReveal>
                <ScrollReveal direction="left" delay={200} className="bg-white p-1.5 rounded-full shadow-lg border border-zinc-100 flex gap-2 overflow-x-auto hide-scrollbar max-w-full">
                  {categories.map((cat) => (
                    <button key={cat} onClick={() => setActiveCategory(cat)}
                      className={`px-8 py-3.5 rounded-full font-bold text-sm whitespace-nowrap transition-all duration-300 ${activeCategory === cat ? 'bg-zinc-900 text-white shadow-md' : 'bg-transparent text-zinc-500 hover:text-zinc-900 hover:bg-zinc-50'}`}>
                      {cat}
                    </button>
                  ))}
                </ScrollReveal>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 lg:gap-10">
                {filteredMenu.map((item, index) => (
                  <ScrollReveal key={item.name} direction="up" delay={index * 100}>
                    <div className="group relative bg-white rounded-[2rem] overflow-hidden border border-zinc-100 shadow-sm hover:shadow-[0_20px_40px_-15px_rgba(0,0,0,0.1)] transition-all duration-500 hover:-translate-y-2 flex flex-col h-full">
                      <div className="relative h-64 overflow-hidden bg-zinc-100">
                        <img src={item.img} alt={item.name} onError={handleImageError}
                          className="w-full h-full object-cover transform group-hover:scale-105 transition-all duration-700 ease-out" />
                        <div className="absolute top-4 left-4 z-20 flex flex-col gap-2">
                          {item.badge && <span className="bg-zinc-900/90 backdrop-blur-md text-white text-[10px] font-black px-3 py-1.5 rounded-full uppercase tracking-widest shadow-md">{item.badge}</span>}
                          {item.spicy && <span className="bg-red-600 text-white text-[10px] font-black px-3 py-1.5 rounded-full uppercase tracking-widest shadow-md flex items-center gap-1"><FlameIcon size={12} /> Picante</span>}
                        </div>
                      </div>
                      <div className="p-6 md:p-8 flex flex-col flex-grow bg-white">
                        <h3 className="text-2xl font-black text-zinc-900 tracking-tight leading-none mb-3">{item.name}</h3>
                        <p className="text-zinc-500 font-medium text-sm leading-relaxed mb-8 flex-grow">{item.desc}</p>
                        <div className="flex items-center justify-between mt-auto">
                          <span className="text-3xl font-black text-zinc-900 tracking-tighter">{item.price}</span>
                          <a href="#sedes" onClick={(e) => scrollToSection(e, 'sedes')}
                            className="w-12 h-12 bg-red-600 text-white rounded-full flex items-center justify-center transition-all duration-300 shadow-md hover:scale-110 hover:bg-red-700">
                            <ShoppingBagIcon />
                          </a>
                        </div>
                      </div>
                    </div>
                  </ScrollReveal>
                ))}
              </div>

              {filteredMenu.length === 0 && (
                <div className="text-center py-20 text-zinc-400 font-medium text-lg border-2 border-dashed border-zinc-200 rounded-[2rem]">
                  Próximamente agregaremos más opciones en esta categoría.
                </div>
              )}
            </div>
          </section>

          {/* === LOCATIONS === */}
          <section id="sedes" className="py-32 bg-zinc-900 text-white relative overflow-hidden">
            <div className="absolute top-0 right-0 w-full h-full overflow-hidden pointer-events-none">
              <div className="absolute -top-[50%] -right-[10%] w-[1000px] h-[1000px] bg-red-600/10 rounded-full blur-[100px]"></div>
              <div className="absolute -bottom-[50%] -left-[10%] w-[800px] h-[800px] bg-orange-500/10 rounded-full blur-[100px]"></div>
            </div>

            <div className="max-w-7xl mx-auto px-6 lg:px-8 relative z-10">
              <ScrollReveal direction="up" className="text-center max-w-4xl mx-auto mb-20">
                <h2 className="text-6xl md:text-8xl font-black tracking-tighter mb-6 leading-none">
                  Listo para <br />
                  <span className="text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-orange-400">servir.</span>
                </h2>
                <p className="text-xl text-zinc-400 font-medium">Nuestros domiciliarios llevan el datáfono hasta tu puerta. Selecciona tu sede más cercana.</p>
              </ScrollReveal>

              <ScrollReveal direction="up" delay={200} className="bg-white rounded-[2rem] p-6 lg:p-10 shadow-2xl max-w-5xl mx-auto text-zinc-900 relative z-20">
                <h3 className="text-xl font-bold mb-4">Buscar dirección</h3>
                <div className="relative mb-6">
                  <SearchIcon className="absolute left-4 top-1/2 -translate-y-1/2 text-zinc-400" />
                  <input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Buscar por sede, ciudad o dirección..."
                    className="w-full bg-zinc-100 border-none rounded-2xl py-4 pl-12 pr-4 text-zinc-900 font-medium focus:outline-none focus:ring-2 focus:ring-red-500 transition-all" />
                  {searchQuery && (
                    <button onClick={() => setSearchQuery('')} className="absolute right-4 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-zinc-600">
                      <XIcon size={20} />
                    </button>
                  )}
                </div>

                <div className="relative h-64 md:h-[400px] rounded-2xl overflow-hidden mb-8 bg-zinc-200">
                  {activeLocation ? (
                    <iframe src={`https://maps.google.com/maps?q=${activeLocation.mapQuery}&t=&z=15&ie=UTF8&iwloc=&output=embed`}
                      width="100%" height="100%" style={{ border: 0 }} allowFullScreen="" loading="lazy"
                      referrerPolicy="no-referrer-when-downgrade" title="Mapa de sede"></iframe>
                  ) : (
                    <div className="w-full h-full flex items-center justify-center bg-zinc-100 text-zinc-500 font-medium">No hay sedes para mostrar en el mapa</div>
                  )}
                  <button onClick={handleUseMyLocation}
                    className="absolute top-6 left-1/2 -translate-x-1/2 bg-white text-zinc-900 px-5 py-3 rounded-full font-bold text-sm shadow-[0_10px_20px_rgba(0,0,0,0.1)] flex items-center gap-2 hover:scale-105 transition-all z-10">
                    {showLocationToast ? (<><CheckCircleIcon className="text-green-500" /> Ubicación Activada</>) : (<><NavigationIcon className="text-zinc-900" /> Utilizar mi ubicación</>)}
                  </button>
                </div>

                <h3 className="text-xl font-bold mb-4">
                  Locales cercanos {searchQuery && <span className="text-zinc-400 text-sm font-normal">({filteredLocations.length} resultados)</span>}
                </h3>

                <div className="max-h-[400px] overflow-y-auto pr-2 space-y-2" style={{ scrollbarWidth: 'thin' }}>
                  {filteredLocations.length > 0 ? filteredLocations.map((loc, index) => (
                    <button key={index} onClick={() => setActiveMapIndex(index)}
                      className={`w-full text-left py-5 px-4 flex flex-col md:flex-row md:items-center justify-between gap-4 group cursor-pointer rounded-2xl transition-all duration-300 ${activeMapIndex === index ? 'bg-red-50 border border-red-100' : 'hover:bg-zinc-50 border border-transparent'}`}>
                      <div className="flex gap-4">
                        <div className={`w-6 h-6 rounded-full flex items-center justify-center font-bold text-xs flex-shrink-0 mt-1 transition-colors ${activeMapIndex === index ? 'bg-red-600 text-white' : 'bg-zinc-900 text-white'}`}>
                          {index + 1}
                        </div>
                        <div>
                          <h4 className="text-lg font-black text-zinc-900 mb-1">{loc.name}</h4>
                          <p className="text-xs text-zinc-500 font-medium uppercase mb-3">A {loc.distance} - SANTANDER / {loc.city} / {loc.address}</p>
                          <div className="flex items-center gap-2">
                            <span className="w-2 h-2 rounded-full bg-green-500"></span>
                            <span className="text-sm font-medium text-zinc-600">Abierto - Cierra: 20:55</span>
                          </div>
                        </div>
                      </div>
                      <div className="flex flex-wrap gap-2 md:pl-10">
                        <div className={`px-5 py-2.5 rounded-full font-bold text-sm transition-colors ${activeMapIndex === index ? 'bg-white text-red-600 shadow-sm border border-red-100' : 'bg-zinc-100 text-zinc-900 group-hover:bg-zinc-200'}`}>
                          {activeMapIndex === index ? 'Ubicación actual' : 'Ver en mapa'}
                        </div>
                        <a href={`tel:${loc.phones[0]}`} onClick={(e) => e.stopPropagation()}
                          className="bg-red-600 text-white hover:bg-red-700 px-5 py-2.5 rounded-full font-bold text-sm transition-colors flex items-center gap-2 shadow-md">
                          <PhoneIcon /> Llamar
                        </a>
                      </div>
                    </button>
                  )) : (
                    <div className="py-12 text-center text-zinc-500 font-medium bg-zinc-50 rounded-2xl border border-dashed border-zinc-200">
                      No se encontraron sedes que coincidan con "{searchQuery}"
                    </div>
                  )}
                </div>
              </ScrollReveal>
            </div>
          </section>

          {/* === FOOTER === */}
          <footer className="bg-black text-zinc-400 py-12 border-t border-zinc-900">
            <div className="max-w-7xl mx-auto px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-8">
              <div className="flex items-center gap-3">
                <UtensilsIcon className="text-zinc-600" />
                <span className="font-black text-2xl tracking-tighter text-white">Cacareo.</span>
              </div>
              <p className="text-sm font-medium text-center">&copy; {new Date().getFullYear()} Restaurante Cacareo. Todos los derechos reservados.</p>
              <div className="flex items-center gap-2 bg-zinc-900 px-5 py-2.5 rounded-full border border-zinc-800 text-xs font-bold uppercase tracking-widest text-zinc-500">
                <ShieldCheckIcon className="text-zinc-600" size={16} />
                Solo pago contra entrega
              </div>
            </div>
          </footer>
        </div>
      );
    }

    /* ===== RENDER ===== */
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
